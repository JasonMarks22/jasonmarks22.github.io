name: Fetch background photos
on:
  push:
    paths: [".github/workflows/fetch-photos.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos from Unsplash (free Unsplash License)
        run: |
          curl -fsSL -o assets/bg-utah-peaks.jpg "https://images.unsplash.com/photo-1680707330497-a0c870443267?w=2000&q=72&fm=jpg&fit=crop"
          curl -fsSL -o assets/bg-wasatch.jpg "https://images.unsplash.com/photo-1669484417746-a9372703f2cf?w=1600&q=72&fm=jpg&fit=crop"
          ls -la assets
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/bg-utah-peaks.jpg assets/bg-wasatch.jpg
          git commit -m "Add self-hosted background photos" || echo "nothing to commit"
          git push
